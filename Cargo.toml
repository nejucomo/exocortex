[workspace]
members = ["app", "squeeze-frame", "keybinding", "tserv", "db"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.54", features = ["derive"] }
jiff = "0.2.23"
zerocopy = "0.8.47"
color-eyre = "0.6.5"
derive-new = "0.7.0"
derive_more = "2.1.1"
dirs = "6.0.0"
eframe = "0.33"
egui = "0.33"
egui_commonmark = "0.22"
env_logger = "0.11.8"
exocortex-db = { version = "0.1.0", path = "db" }
exocortex-keybinding = { version = "0.1.0", path = "keybinding" }
exocortex-tserv = { version = "0.1.0", path = "tserv" }
extension-traits = "2.0.1"
indoc = "2.0.7"
log = "0.4.29"
logging-options = "0.1.0"
moveslot = "0.1.0"
redb = "3.1.1"
thiserror = "2.0.17"
