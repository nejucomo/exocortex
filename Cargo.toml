[workspace]
# members = ["app", "db", "keybinding", "memory", "redborm", "tserv", "widgets"]
# Disable some borked crates as an expedient
members = ["keybinding", "memory", "tserv", "widgets"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
derive-new = "0.7.0"
derive_builder = "0.20.2"
derive_more = "2.1.1"
dirs = "6.0.0"
eframe = "0.33"
egui = "0.33"
egui_commonmark = "0.22"
env_logger = "0.11.8"
exocortex-db = { version = "0.1.0", path = "db" }
exocortex-keybinding = { version = "0.1.0", path = "keybinding" }
# exocortex-memory = { version = "0.1.0", path = "memory" }
exocortex-redborm = { version = "0.1.0", path = "redborm" }
exocortex-tserv = { version = "0.1.0", path = "tserv" }
exocortex-widgets = { version = "0.1.0", path = "widgets" }
extension-traits = "2.0.1"
indoc = "2.0.7"
jiff = "0.2.23"
log = "0.4.29"
logging-options = "0.1.0"
moveslot = "0.1.0"
redb = "3.1.1"
redb-derive = "0.1.0"
thiserror = "2.0.17"
