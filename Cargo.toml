[workspace]
members = [
  "app",
  "handler",
  "keybinding",
  "lid",
  "memory",
  "memory/redb",
  "redborm",
  "timestamp",
  "tserv",
  "widgets",
]

resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
exocortex-handler = { path = "handler" }
exocortex-keybinding = { path = "keybinding" }
exocortex-lid = { path = "lid" }
exocortex-memory = { path = "memory" }
exocortex-memory-redb = { path = "memory/redb" }
exocortex-redborm = { path = "redborm" }
exocortex-timestamp = { path = "timestamp" }
exocortex-tserv = { path = "tserv" }
exocortex-widgets = { path = "widgets" }

clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
derive-new = "0.7.0"
derive_builder = "0.20.2"
derive_more = "2.1.1"
dirs = "6.0.0"
disqualified = "1.0.0"
eframe = "0.33"
egui = "0.33"
egui_commonmark = "0.22"
env_logger = "0.11.8"
extension-traits = "2.0.1"
indoc = "2.0.7"
jiff = "0.2.23"
log = "0.4.29"
logging-options = "0.1.0"
moveslot = "0.1.0"
redb = "3.1.1"
redb-derive = "0.1.0"
thiserror = "2.0.17"
