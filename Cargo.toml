[package]
name = "exocortex"
version = "0.1.0"
edition = "2021"
description = "A micro-note taking app for quick jots"

[[bin]]
name = "exocortex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.34"
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
